<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pagamentos - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        input, select {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }

        .status-pago {
            color: #10b981;
            font-weight: bold;
        }

        .status-pendente {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button onclick="logout()" style="background:#dc2626;">Sair</button>
</nav>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <h3>Novo Pagamento</h3>

        <input type="number" id="ordem_servico_id" placeholder="ID da OS">
        <input type="number" id="valor" placeholder="Valor">

        <select id="status">
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
        </select>

        <button onclick="addPagamento()">Registrar Pagamento</button>
    </div>

    <!-- LISTA -->
    <div class="title-bar">
        <h3>Pagamentos</h3>
        <button class="refresh" onclick="loadPagamentos()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>OS</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="pagamentosTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/pagamentos";

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

/* LISTAR */
async function loadPagamentos() {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("pagamentosTable");
    table.innerHTML = "";

    data.forEach(p => {

        const statusClass = p.status === "pago"
            ? "status-pago"
            : "status-pendente";

        table.innerHTML += `
            <tr>
                <td>${p.id}</td>
                <td>${p.ordem_servico_id}</td>
                <td>R$ ${p.valor}</td>
                <td class="${statusClass}">${p.status}</td>
                <td class="actions">
                    <button onclick="deletePagamento(${p.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

/* CREATE */
async function addPagamento() {
    const ordem_servico_id = document.getElementById("ordem_servico_id").value;
    const valor = document.getElementById("valor").value;
    const status = document.getElementById("status").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            ordem_servico_id: Number(ordem_servico_id),
            valor: Number(valor),
            status
        })
    });

    loadPagamentos();
}

/* DELETE */
async function deletePagamento(id) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    loadPagamentos();
}

/* INIT */
loadPagamentos();
</script>

</body>
</html>
