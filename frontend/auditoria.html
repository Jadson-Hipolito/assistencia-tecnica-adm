<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Auditoria - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        /* FORM */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .form h3 {
            margin-top: 0;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<header>
    <h1>Sistema de Assistência Técnica</h1>
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">Ordens de Serviço</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button class="logout" onclick="logout()">Sair</button>
</nav>

<div class="container">

    <div class="top-bar">
        <h3>Histórico de Ações</h3>
        <button onclick="loadAuditoria()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Entidade</th>
                <th>Data</th>
            </tr>
        </thead>

        <tbody id="auditoriaTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/auditoria/";

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("token_type");
    localStorage.removeItem("usuario");
    window.location.replace("index.html");
}

/* LISTAR */
async function loadAuditoria() {
    try {
        const res = await fetch(API);
        const data = await res.json();

        const table = document.getElementById("auditoriaTable");
        table.innerHTML = "";

        data.forEach(a => {

            let tipoClass = "";
            if (a.acao === "CREATE") tipoClass = "tipo-create";
            if (a.acao === "UPDATE") tipoClass = "tipo-update";
            if (a.acao === "DELETE") tipoClass = "tipo-delete";

            table.innerHTML += `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.usuario || 'sistema'}</td>
                    <td class="${tipoClass}">${a.acao}</td>
                    <td>${a.entidade}</td>
                    <td>${a.data || ''}</td>
                </tr>
            `;
        });

    } catch (err) {
        console.error("Erro ao carregar auditoria:", err);
        alert("Erro ao carregar auditoria");
    }
}

loadAuditoria();
</script>

</body>
</html>
