<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Auditoria - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* NAVBAR */
        nav {
            background: #111827;
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        nav button:hover {
            background: #1d4ed8;
        }

        .logout {
            background: #ef4444 !important;
        }

        .container {
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .tipo-create { color: green; font-weight: bold; }
        .tipo-update { color: orange; font-weight: bold; }
        .tipo-delete { color: red; font-weight: bold; }
    </style>
</head>

<body>

<header>
    <h1>Sistema de Assistência Técnica</h1>
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">Ordens de Serviço</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button class="logout" onclick="logout()">Sair</button>
</nav>

<div class="container">

    <div class="top-bar">
        <h3>Histórico de Ações</h3>
        <button onclick="loadAuditoria()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Entidade</th>
                <th>Data</th>
            </tr>
        </thead>

        <tbody id="auditoriaTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/auditoria/";

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

/* LISTAR */
async function loadAuditoria() {
    try {
        const res = await fetch(API);
        const data = await res.json();

        const table = document.getElementById("auditoriaTable");
        table.innerHTML = "";

        data.forEach(a => {

            let tipoClass = "";
            if (a.acao === "CREATE") tipoClass = "tipo-create";
            if (a.acao === "UPDATE") tipoClass = "tipo-update";
            if (a.acao === "DELETE") tipoClass = "tipo-delete";

            table.innerHTML += `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.usuario || 'sistema'}</td>
                    <td class="${tipoClass}">${a.acao}</td>
                    <td>${a.entidade}</td>
                    <td>${a.data || ''}</td>
                </tr>
            `;
        });

    } catch (err) {
        console.error("Erro ao carregar auditoria:", err);
        alert("Erro ao carregar auditoria");
    }
}

loadAuditoria();
</script>

</body>
</html>
