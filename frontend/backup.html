<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Backup - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        nav button:hover {
            background: #4b5563;
        }

        .logout {
            background: #dc2626 !important;
        }

        .logout:hover {
            background: #b91c1c !important;
        }

        /* CONTAINER */
        .container {
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        /* CARD */
        .card {
            background: white;
            width: 100%;
            max-width: 650px;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .danger {
            background: #ef4444;
            color: white;
        }

        .danger:hover {
            background: #dc2626;
        }

        /* STATUS */
        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #374151;
        }

        /* LIST */
        .list {
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #e5e7eb;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    Sistema de Assistência Técnica
</header>

<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>
    <button class="logout" onclick="logout()">Sair</button>
</nav>

<div class="container">

    <div class="card">

        <h2>Backup do Sistema</h2>

        <button class="btn primary" onclick="createBackup()">Criar Backup</button>
        <button class="btn primary" onclick="loadBackups()">Listar Backups</button>
        <button class="btn danger" onclick="clearBackups()">Limpar</button>

        <div class="status" id="status"></div>

        <div class="list" id="backupList"></div>

    </div>

</div>

<script>
const API = "http://localhost:8000/api/backup/";
const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "index.html";
}

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("token_type");
    localStorage.removeItem("usuario");
    window.location.replace("index.html");
}

/* CREATE */
async function createBackup() {

    const res = await fetch(`${API}manual`, {
        method: "POST",
        headers: {
            Authorization: `Bearer ${token}`
        }
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.detail);
        return;
    }

    document.getElementById("status").innerText =
        "Backup criado com sucesso!";

    loadBackups();
}

/* LIST */
async function loadBackups() {

    const res = await fetch(API, {
        headers: {
            Authorization: `Bearer ${token}`
        }
    });

    const data = await res.json();

    const list = document.getElementById("backupList");

    list.innerHTML = "";

    data.forEach(b => {

        list.innerHTML += `
            <div class="item">
                <strong>${b.file_name}</strong><br>
                ${b.created_at}
            </div>
        `;

    });

}



</script>

</body>
</html>
