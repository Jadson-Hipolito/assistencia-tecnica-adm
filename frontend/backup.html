<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Backup - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
            text-align: center;
        }

        button {
            padding: 12px 18px;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            margin: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .danger {
            background: #ef4444;
        }

        .danger:hover {
            background: #dc2626;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<header>
    <h1>Backup do Sistema</h1>
</header>

<div class="container">

    <div class="card">

        <h3>Gerenciamento de Backup</h3>

        <button onclick="createBackup()">Criar Backup</button>

        <button onclick="loadBackups()">Listar Backups</button>

        <button class="danger" onclick="clearBackups()">Limpar Backups</button>

        <div class="status" id="status"></div>

        <div id="backupList" style="margin-top: 20px; text-align: left;"></div>

    </div>

</div>

<script>
const API = "http://localhost:8000/api/backup";

// CRIAR BACKUP
async function createBackup() {
    try {
        const res = await fetch(`${API}/create`, { method: "POST" });
        const data = await res.json();
        document.getElementById("status").innerText = data.message || "Backup criado!";
    } catch (err) {
        document.getElementById("status").innerText = "Erro ao criar backup";
    }
}

// LISTAR BACKUPS
async function loadBackups() {
    try {
        const res = await fetch(`${API}/list`);
        const data = await res.json();

        const list = document.getElementById("backupList");
        list.innerHTML = "<h4>Backups:</h4>";

        data.forEach(b => {
            list.innerHTML += `
                <div style="padding:5px; border-bottom:1px solid #ddd;">
                    📦 ${b.nome} - ${b.data}
                </div>
            `;
        });

    } catch (err) {
        document.getElementById("status").innerText = "Erro ao listar backups";
    }
}

// LIMPAR BACKUPS
async function clearBackups() {
    try {
        const res = await fetch(`${API}/clear`, { method: "DELETE" });
        const data = await res.json();
        document.getElementById("status").innerText = data.message || "Backups removidos!";
        document.getElementById("backupList").innerHTML = "";
    } catch (err) {
        document.getElementById("status").innerText = "Erro ao limpar backups";
    }
}
</script>

</body>
</html>
