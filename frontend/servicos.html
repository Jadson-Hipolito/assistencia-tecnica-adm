<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Serviços - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>


<nav>

<button onclick="go('dashboard.html')">Home</button>
<button onclick="go('clientes.html')">Clientes</button>
<button onclick="go('funcionarios.html')">Funcionários</button>
<button onclick="go('equipamentos.html')">Equipamentos</button>
<button onclick="go('ordens_servico.html')">OS</button>
<button onclick="go('servicos.html')">Serviços</button>
<button onclick="go('pagamentos.html')">Pagamentos</button>
<button onclick="go('relatorios.html')">Relatórios</button>
<button onclick="go('auditoria.html')">Auditoria</button>
<button onclick="go('backup.html')">Backup</button>

<button onclick="logout()" style="background:#dc2626;">
Sair
</button>

</nav>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="form">
        <h3>Novo Serviço</h3>

        <input type="text" id="nome" placeholder="Nome do serviço">
        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="preco" placeholder="Preço">

        <button onclick="addServico()">Adicionar</button>
    </div>

    <!-- TABELA -->
    <div class="title-bar">

    <h3>Lista de Serviços</h3>

    <button class="refresh" onclick="loadServicos()">
    Atualizar
    </button>

    </div>


    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="servicosTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/servicos/";

/* =====================
   AUTH
===================== */

const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "login.html";
}

function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("token_type");
    localStorage.removeItem("usuario");
    window.location.replace("index.html");
}
function go(page) {
    window.location.href = page;
}

/* =====================
   LISTAR
===================== */

async function loadServicos() {
    const res = await fetch(API, {
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });
    const data = await res.json();

    const table = document.getElementById("servicosTable");
    table.innerHTML = "";

    data.forEach(s => {
        table.innerHTML += `
            <tr>
                <td>${s.id}</td>
                <td>${s.nome}</td>
                <td>${s.descricao || ''}</td>
                <td>R$ ${s.valor_padrao}</td>
                <td class="actions">
                    <button onclick="deleteServico(${s.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

/* =====================
   CRIAR
===================== */

async function addServico() {

    const nome = document.getElementById("nome").value;
    const descricao = document.getElementById("descricao").value;
    const valor_padrao = Number(document.getElementById("preco").value);

    const res = await fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            nome,
            descricao,
            valor_padrao,
            ativo: true
        })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.detail || "Erro ao cadastrar serviço.");
        return;
    }

    alert("Serviço cadastrado com sucesso!");

    document.getElementById("nome").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("preco").value = "";

    loadServicos();
}

/* =====================
   DELETE
===================== */

async function deleteServico(id) {

    const res = await fetch(`${API}${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.detail || "Erro ao excluir serviço.");
        return;
    }

    alert("Serviço desativado com sucesso!");

    loadServicos();
}

/* INIT */
loadServicos();
</script>

</body>
</html>
