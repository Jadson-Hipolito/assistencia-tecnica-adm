<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Clientes - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        /* FORM */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .form h3 {
            margin-top: 0;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button onclick="logout()" style="background:#dc2626;">Sair</button>
</nav>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <h3>Novo Cliente</h3>

        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="documento" placeholder="CPF/CNPJ">
        <input type="text" id="endereco" placeholder="Endereço">
        <input type="text" id="contato" placeholder="Telefone ou contato">

        <button onclick="addCliente()">Adicionar</button>
    </div>

    <!-- LISTA -->
    <div class="title-bar">
        <h3>Lista de Clientes</h3>
        <button class="refresh" onclick="loadClientes()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Documento</th>
                <th>Endereço</th>
                <th>Contato</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="clientesTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/clientes/";

const token = localStorage.getItem("access_token");
if (!token) {
    window.location.href = "login.html";
}

const headers = {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
};

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("token_type");
    localStorage.removeItem("usuario");
    window.location.replace("index.html");
}

/* LISTAR */
async function loadClientes() {

    try {

        const res = await fetch(API, {
            method: "GET",
            headers: headers
        });

        if (!res.ok) {
            console.log(await res.text());
            alert("Erro ao carregar clientes.");
            return;
        }

        const data = await res.json();

        const table = document.getElementById("clientesTable");
        table.innerHTML = "";

        data.forEach(c => {

            table.innerHTML += `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.documento || ''}</td>
                    <td>${c.endereco || ''}</td>
                    <td>${c.contato || ''}</td>
                    <td class="actions">
                        <button
                            style="background:#2563eb;margin-right:5px;"
                            onclick="editarCliente(${c.id})">
                            Editar
                        </button>

                        <button
                            style="background:#dc2626;"
                            onclick="deleteCliente(${c.id})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;

        });

    } catch (erro) {

        console.error(erro);
        alert("Erro ao conectar com o servidor.");

    }

}

/* CREATE */
async function addCliente() {

    const nome = document.getElementById("nome").value;
    const documento = document.getElementById("documento").value;
    const endereco = document.getElementById("endereco").value;
    const contato = document.getElementById("contato").value;


    const res = await fetch(API, {

        method: "POST",

        headers: headers,

        body: JSON.stringify({

            nome,
            documento,
            endereco,
            contato,
            ativo: true

        })

    });


    const data = await res.json();


    if (!res.ok) {

    let mensagem = "";

    data.detail.forEach(erro => {
        mensagem += `${erro.msg}\n`;
    });

    alert(mensagem);

    return;
}


    alert("Cliente cadastrado com sucesso!");


    document.getElementById("nome").value = "";
    document.getElementById("documento").value = "";
    document.getElementById("endereco").value = "";
    document.getElementById("contato").value = "";


    loadClientes();

}

/* EDITAR */
async function editarCliente(id) {

    const nome = prompt("Novo nome:");

    if (nome === null) return;

    const endereco = prompt("Novo endereço:");

    if (endereco === null) return;

    const contato = prompt("Novo contato:");

    if (contato === null) return;

    try {

        const res = await fetch(`${API}${id}`, {

            method: "PUT",

            headers: headers,

            body: JSON.stringify({

                nome,
                endereco,
                contato

            })

        });

        const data = await res.json();

        if (!res.ok) {

            console.log(data);
            alert("Erro ao atualizar cliente.");
            return;

        }

        alert("Cliente atualizado com sucesso!");

        loadClientes();

    } catch (erro) {

        console.error(erro);
        alert("Erro ao conectar com o servidor.");

    }

}

/* DELETE */
async function deleteCliente(id) {

    if (!confirm("Deseja realmente excluir este cliente?")) {
        return;
    }

    try {

        const res = await fetch(`${API}${id}`, {
            method: "DELETE",
            headers: headers
        });

        if (!res.ok) {

            const erro = await res.text();
            console.log(erro);

            alert("Erro ao excluir cliente.");
            return;
        }

        alert("Cliente excluído com sucesso!");

        loadClientes();

    } catch (erro) {

        console.error(erro);
        alert("Erro ao conectar com o servidor.");

    }
}

/* INIT */
loadClientes();
</script>

</body>
</html>
