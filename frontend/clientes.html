<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Clientes - Sistema de Assistência Técnica</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .actions button {
            margin-right: 5px;
            background: #10b981;
        }

        .actions button.delete {
            background: #ef4444;
        }

        .form {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
    </style>
</head>

<body>

<header>
    <h1>Gestão de Clientes</h1>
</header>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="form">
        <h3>Novo Cliente</h3>

        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="telefone" placeholder="Telefone">

        <button onclick="addCliente()">Adicionar</button>
    </div>

    <!-- TABELA -->
    <div class="top-bar">
        <h3>Lista de Clientes</h3>
        <button onclick="loadClientes()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="clientesTable">
        </tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/clientes";

// LISTAR
async function loadClientes() {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("clientesTable");
    table.innerHTML = "";

    data.forEach(c => {
        table.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.nome}</td>
                <td>${c.email || ''}</td>
                <td>${c.telefone || ''}</td>
                <td class="actions">
                    <button onclick="deleteCliente(${c.id})" class="delete">Excluir</button>
                </td>
            </tr>
        `;
    });
}

// CRIAR
async function addCliente() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const telefone = document.getElementById("telefone").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, telefone })
    });

    loadClientes();
}

// DELETE
async function deleteCliente(id) {
    await fetch(`${API}/${id}`, {
        method: "DELETE"
    });

    loadClientes();
}

// INIT
loadClientes();
</script>

</body>
</html>
