<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Funcionários - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        /* FORM */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button onclick="logout()" style="background:#dc2626;">Sair</button>
</nav>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <h3>Novo Funcionário</h3>

        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="cargo" placeholder="Cargo">

        <button onclick="addFuncionario()">Adicionar</button>
    </div>

    <!-- LISTA -->
    <div class="title-bar">
        <h3>Lista de Funcionários</h3>
        <button class="refresh" onclick="loadFuncionarios()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Cargo</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="funcionariosTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/funcionarios";

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

/* LISTAR */
async function loadFuncionarios() {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("funcionariosTable");
    table.innerHTML = "";

    data.forEach(f => {
        table.innerHTML += `
            <tr>
                <td>${f.id}</td>
                <td>${f.nome}</td>
                <td>${f.email || ''}</td>
                <td>${f.cargo || ''}</td>
                <td class="actions">
                    <button onclick="deleteFuncionario(${f.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

/* CREATE */
async function addFuncionario() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const cargo = document.getElementById("cargo").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, cargo })
    });

    loadFuncionarios();
}

/* DELETE */
async function deleteFuncionario(id) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    loadFuncionarios();
}

/* INIT */
loadFuncionarios();
</script>

</body>
</html>
