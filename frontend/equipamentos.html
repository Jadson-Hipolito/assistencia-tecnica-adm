<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Equipamentos - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        /* FORM */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button onclick="logout()" style="background:#dc2626;">Sair</button>
</nav>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <h3>Novo Equipamento</h3>

        <input type="text" id="nome" placeholder="Nome do equipamento">
        <input type="text" id="tipo" placeholder="Tipo">
        <input type="text" id="marca" placeholder="Marca">
        <input type="text" id="modelo" placeholder="Modelo">
        <input type="text" id="codigo" placeholder="Número de série">
        <input type="text" id="descricao" placeholder="Descrição">


        <button onclick="addEquipamento()">Adicionar</button>
    </div>

    <!-- LISTA -->
    <div class="title-bar">
        <h3>Lista de Equipamentos</h3>
        <button class="refresh" onclick="loadEquipamentos()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Número de Série</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="equipamentosTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/equipamentos/";
const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "index.html";
}

const headers = {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
};

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("token_type");
    localStorage.removeItem("usuario");
    window.location.replace("index.html");
}

/* LISTAR */
async function loadEquipamentos() {
    const res = await fetch(API, {
        method: "GET",
        headers: headers
    });
    const data = await res.json();

    const table = document.getElementById("equipamentosTable");
    table.innerHTML = "";

    data.forEach(e => {
        table.innerHTML += `
            <tr>
                <td>${e.id}</td>
                <td>${e.nome}</td>
                <td>${e.marca || ''}</td>
                <td>${e.modelo || ''}</td>
                <td>${e.codigo || ''}</td>
                <td class="actions">
                    <button onclick="deleteEquipamento(${e.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

/* CREATE */
async function addEquipamento() {

    const nome = document.getElementById("nome").value;
    const tipo = document.getElementById("tipo").value;
    const marca = document.getElementById("marca").value;
    const modelo = document.getElementById("modelo").value;
    const codigo = document.getElementById("codigo").value;
    const descricao = document.getElementById("descricao").value;

    try {

        const res = await fetch(API, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
                nome,
                tipo,
                marca,
                modelo,
                codigo,
                descricao
            })
        });


        const data = await res.json();


        if (!res.ok) {

            console.log(JSON.stringify(data, null, 2));

            if (data.detail) {

                alert(
                    Array.isArray(data.detail)
                    ? data.detail.map(e => e.msg).join("\n")
                    : data.detail
                );

            } else {

                alert("Erro ao cadastrar equipamento.");

            }

            return;
        }


        alert("Equipamento cadastrado com sucesso!");


        document.getElementById("nome").value = "";
        document.getElementById("tipo").value = "";
        document.getElementById("marca").value = "";
        document.getElementById("modelo").value = "";
        document.getElementById("codigo").value = "";
        document.getElementById("descricao").value = "";


        loadEquipamentos();


    } catch (erro) {

        console.error(erro);
        alert("Erro ao conectar ao servidor.");

    }
}

/* DELETE */
async function deleteEquipamento(id) {

    if (!confirm("Deseja realmente excluir este equipamento?")) {
        return;
    }

    const res = await fetch(`${API}${id}`, {
        method: "DELETE",
        headers: headers
    });

    const data = await res.json();

    if (!res.ok) {
        console.error(data);
        alert(data.detail || "Erro ao excluir equipamento");
        return;
    }

    alert("Equipamento excluído com sucesso!");

    loadEquipamentos();
}

/* INIT */
loadEquipamentos();
</script>

</body>
</html>
