<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Equipamentos - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 220px;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .actions button {
            background: #ef4444;
        }
    </style>
</head>

<body>

<header>
    <h1>Gestão de Equipamentos</h1>
</header>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="form">
        <h3>Novo Equipamento</h3>

        <input type="text" id="nome" placeholder="Nome do equipamento">
        <input type="text" id="marca" placeholder="Marca">
        <input type="text" id="modelo" placeholder="Modelo">
        <input type="text" id="serial" placeholder="Número de série">

        <button onclick="addEquipamento()">Adicionar</button>
    </div>

    <!-- TABELA -->
    <h3>Lista de Equipamentos</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Serial</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="equipamentosTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/equipamentos";

// LISTAR
async function loadEquipamentos() {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("equipamentosTable");
    table.innerHTML = "";

    data.forEach(e => {
        table.innerHTML += `
            <tr>
                <td>${e.id}</td>
                <td>${e.nome}</td>
                <td>${e.marca || ''}</td>
                <td>${e.modelo || ''}</td>
                <td>${e.serial || ''}</td>
                <td class="actions">
                    <button onclick="deleteEquipamento(${e.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

// CRIAR
async function addEquipamento() {
    const nome = document.getElementById("nome").value;
    const marca = document.getElementById("marca").value;
    const modelo = document.getElementById("modelo").value;
    const serial = document.getElementById("serial").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nome,
            marca,
            modelo,
            serial
        })
    });

    loadEquipamentos();
}

// DELETE
async function deleteEquipamento(id) {
    await fetch(`${API}/${id}`, {
        method: "DELETE"
    });

    loadEquipamentos();
}

// INIT
loadEquipamentos();
</script>

</body>
</html>
