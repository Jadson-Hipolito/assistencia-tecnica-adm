<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Ordens de Serviço - Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
        }

        nav {
            background: #1f2937;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        .container {
            padding: 25px;
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        input, select {
            padding: 10px;
            margin: 5px;
            width: 220px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .actions button {
            background: #ef4444;
            padding: 6px 10px;
            font-size: 12px;
        }

        .actions button:hover {
            background: #dc2626;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .refresh {
            background: #10b981;
        }

        .refresh:hover {
            background: #059669;
        }

        .status-aberta { color: #2563eb; font-weight: bold; }
        .status-andamento { color: #f59e0b; font-weight: bold; }
        .status-finalizada { color: #10b981; font-weight: bold; }
    </style>
</head>

<body>

<header>
    Sistema de Gestão de Assistência Técnica
</header>

<!-- NAVBAR -->
<nav>
    <button onclick="go('dashboard.html')">Home</button>
    <button onclick="go('clientes.html')">Clientes</button>
    <button onclick="go('funcionarios.html')">Funcionários</button>
    <button onclick="go('equipamentos.html')">Equipamentos</button>
    <button onclick="go('ordens_servico.html')">OS</button>
    <button onclick="go('servicos.html')">Serviços</button>
    <button onclick="go('pagamentos.html')">Pagamentos</button>
    <button onclick="go('relatorios.html')">Relatórios</button>
    <button onclick="go('auditoria.html')">Auditoria</button>
    <button onclick="go('backup.html')">Backup</button>

    <button onclick="logout()" style="background:#dc2626;">Sair</button>
</nav>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <h3>Nova Ordem de Serviço</h3>

        <input type="text" id="descricao" placeholder="Descrição">
        <input type="number" id="cliente_id" placeholder="ID Cliente">
        <input type="number" id="equipamento_id" placeholder="ID Equipamento">

        <select id="status">
            <option value="aberta">Aberta</option>
            <option value="em_andamento">Em andamento</option>
            <option value="finalizada">Finalizada</option>
        </select>

        <button onclick="addOS()">Criar OS</button>
    </div>

    <!-- LISTA -->
    <div class="title-bar">
        <h3>Ordens de Serviço</h3>
        <button class="refresh" onclick="loadOS()">Atualizar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Cliente</th>
                <th>Equipamento</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="osTable"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:8000/api/ordem-servico";

/* NAV */
function go(page) {
    window.location.href = page;
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

/* LISTAR */
async function loadOS() {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("osTable");
    table.innerHTML = "";

    data.forEach(os => {

        let statusClass = "";
        if (os.status === "aberta") statusClass = "status-aberta";
        if (os.status === "em_andamento") statusClass = "status-andamento";
        if (os.status === "finalizada") statusClass = "status-finalizada";

        table.innerHTML += `
            <tr>
                <td>${os.id}</td>
                <td>${os.descricao}</td>
                <td>${os.cliente_id}</td>
                <td>${os.equipamento_id}</td>
                <td class="${statusClass}">${os.status}</td>
                <td class="actions">
                    <button onclick="deleteOS(${os.id})">Excluir</button>
                </td>
            </tr>
        `;
    });
}

/* CREATE */
async function addOS() {
    const descricao = document.getElementById("descricao").value;
    const cliente_id = document.getElementById("cliente_id").value;
    const equipamento_id = document.getElementById("equipamento_id").value;
    const status = document.getElementById("status").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            descricao,
            cliente_id: Number(cliente_id),
            equipamento_id: Number(equipamento_id),
            status
        })
    });

    loadOS();
}

/* DELETE */
async function deleteOS(id) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    loadOS();
}

/* INIT */
loadOS();
</script>

</body>
</html>
