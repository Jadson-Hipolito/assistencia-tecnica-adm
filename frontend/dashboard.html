<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f3f4f6;
    }

    header {
        background: #111827;
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        font-size: 18px;
        margin: 0;
    }

    header div {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    button {
        cursor: pointer;
        border: none;
    }

    #logout {
        background: #dc2626;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
    }

    #logout:hover {
        background: #b91c1c;
    }

    main {
        padding: 30px;
    }

    h2 {
        margin-bottom: 20px;
        color: #111827;
    }

    .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
        color: #111827;
        box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        cursor: pointer;
        transition: 0.2s;
    }

    .card:hover {
        transform: translateY(-3px);
        background: #f9fafb;
    }

    #usuario {
        font-size: 14px;
        color: #e5e7eb;
    }
</style>

</head>

<body>

<header>

<h1>Sistema de Gestão de Assistência Técnica</h1>

<div>
<span id="usuario">Carregando...</span>
<button id="logout">Sair</button>
</div>

</header>

<main>

<h2>Painel Principal</h2>

<div class="dashboard">

<div class="card" onclick="go('clientes.html')">Clientes</div>
<div class="card" onclick="go('funcionarios.html')">Funcionários</div>
<div class="card" onclick="go('equipamentos.html')">Equipamentos</div>
<div class="card" onclick="go('ordens_servico.html')">Ordens de Serviço</div>
<div class="card" onclick="go('pagamentos.html')">Pagamentos</div>
<div class="card" onclick="go('servicos.html')">Serviços</div>
<div class="card" onclick="go('relatorios.html')">Relatórios</div>
<div class="card" onclick="go('auditoria.html')">Auditoria</div>
<div class="card" onclick="go('backup.html')">Backup</div>

</div>

</main>

<script>

console.log("Dashboard carregado.");

const token = localStorage.getItem("access_token");

console.log("Token:", token);

if (!token) {
    window.location.href = "login.html";
}

function go(page) {
    window.location.href = page;
}

fetch("http://localhost:8000/api/auth/me", {

    method: "GET",

    headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/json"
    }

})

.then(async (response) => {

    console.log("Status:", response.status);

    if (!response.ok) {

        console.log(await response.text());

        localStorage.clear();

        window.location.href = "login.html";

        return null;
    }

    return response.json();

})

.then((usuario) => {

    if (!usuario) return;

    console.log(usuario);

    document.getElementById("usuario").textContent =
        "Bem-vindo, " + usuario.nome;

})

.catch((erro) => {

    console.error("Erro:", erro);

});

document.getElementById("logout").addEventListener("click", () => {

    localStorage.clear();

    window.location.href = "login.html";

});

</script>

</body>

</html>
